name: unified-api CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
    # The defaults plus label events: applying `changelog-rewrite` has to
    # re-run the check it exempts, and removing it has to re-assert it.
    types: [opened, synchronize, reopened, labeled, unlabeled]
  # Advisories move while the lockfile stands still: a RUSTSEC entry published
  # against an unchanged Cargo.lock would otherwise go unnoticed until the
  # next PR happens to run the audit job. The nightly run re-checks the tip of
  # main; only audit and deny run on it (the other jobs gate on event_name).
  schedule:
    - cron: '30 5 * * *'

# One live run per PR: the labeled/unlabeled triggers above mean a freshly
# opened PR fires once for "opened" and once per label applied — Dependabot
# applies its labels one API call at a time, which made every bump PR run the
# whole workflow five times for one commit. Newer runs supersede older ones
# for the same PR; pushes, tags and the nightly schedule never cancel (a
# release build must not be killable by an unrelated event), they queue.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    # The nightly schedule exists for the advisory checks; build/test state
    # cannot change without a commit, so re-running them would be noise.
    # build-image and release need this job, so skipping it skips them too.
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Released CHANGELOG sections are the record of what shipped; only
      # "## [Unreleased]" is open for editing. Rebasing a branch across a
      # release silently drops its entry into the just-released section, so
      # this is checked rather than remembered. Two exemptions, both explicit:
      # release/* branches, since cutting a version rewrites that region by
      # definition, and the `changelog-rewrite` label, for a deliberate
      # correction to published history (a redaction, a wrong date). The label
      # lives on the PR, so waiving the guard is a reviewable act rather than
      # a branch name nobody looks at.
      - name: CHANGELOG history is immutable
        if: >-
          github.event_name == 'pull_request'
          && !startsWith(github.head_ref, 'release/')
          && !contains(github.event.pull_request.labels.*.name, 'changelog-rewrite')
        env:
          BASE: ${{ github.base_ref }}
        run: |
          git fetch --no-tags --depth=1 origin "$BASE"
          ./.github/scripts/check-changelog.sh "origin/$BASE"

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt, llvm-tools-preview

      - uses: Swatinem/rust-cache@v2

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov

      - run: cargo fmt --check

      - run: cargo clippy --all-targets -- -D warnings

      # One instrumented run does both jobs: cargo-llvm-cov executes the whole
      # suite while measuring, so tests run ONCE per PR instead of once here
      # and once in a separate coverage workflow — and the floor is enforced
      # by this required check, not by an advisory badge.
      #
      # The floor is a ratchet against silent erosion, not a target: the suite
      # measures ~94.5% lines at the time of writing, the gate fails under 92
      # — a real regression trips it, normal variance does not. Raise it when
      # the number durably rises; never lower it to make a PR pass.
      #
      # main.rs is excluded: it is the composition root — wiring plus boot
      # orchestration — exercisable only by running the binary, and counting
      # its lines as permanently red would make the honest number unreadable.
      # Everything main wires IS covered, through AppBuilder.
      - name: tests + coverage floor (fail under 92% lines)
        run: |
          cargo llvm-cov --ignore-filename-regex 'main\.rs$' --fail-under-lines 92 --summary-only | tee coverage.txt
          {
            echo '### Coverage'
            echo '```'
            tail -n 3 coverage.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Scans Cargo.lock against the RUSTSEC advisory database, failing on
      # known-vulnerable dependency versions; ignored advisories (with
      # rationale) live in .cargo/audit.toml. We run cargo-audit directly
      # rather than rustsec/audit-check so the job needs no checks:write token
      # (the default token is read-only) and avoids the deprecated Node 20
      # action runtime.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - run: cargo audit

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # License vetting and source hygiene on top of the advisory scan:
      # a dependency bump cannot quietly pull in a copyleft license or an
      # unapproved git/registry source. Policy lives in deny.toml, whose
      # advisory ignore list mirrors .cargo/audit.toml.
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  deploy:
    # The manifests users actually apply (deploy/) must never drift into
    # invalid — that is the whole reason they are files instead of YAML blocks
    # in prose. Compose is schema-checked by the compose plugin; the k8s
    # manifests by kubeconform (pinned, -strict rejects unknown fields — the
    # same stance the app takes with its own config).
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - run: docker compose -f deploy/compose/compose.yaml config -q

      - name: kubeconform
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.7.0/kubeconform-linux-amd64.tar.gz | tar xz kubeconform
          ./kubeconform -strict -summary -skip Kustomization deploy/k8s/

  build-image:
    needs: test
    # Builds on every PR and every push, publishes only on v* tags.
    # Building everywhere catches image breakage — a builder/runtime base
    # mismatch, a missing apt package — before merge, and long before a tag
    # makes the failure public. Publishing only on tags keeps the registry to
    # released versions instead of one image per merge.
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v7

      - uses: docker/login-action@v4
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v6
        id: meta
        # No raw `latest` tag here: that is what made every merge to main claim
        # the tag. metadata-action's default (latest=auto) already applies
        # `latest` to a semver tag build, which is the only place it belongs.
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=
            type=semver,pattern={{version}}

      - uses: docker/build-push-action@v7
        with:
          context: .
          # The Dockerfile lives under docker/; the context stays the repo
          # root so COPY paths (src/, config/, tests/) are unchanged
          file: docker/Dockerfile
          # Only a v* tag publishes; PRs and main pushes build and throw away
          push: ${{ startsWith(github.ref, 'refs/tags/v') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  release:
    needs: build-image
    # Only on version tags, after the image is published
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Extract changelog section for this version
        run: |
          version="${GITHUB_REF_NAME#v}"
          # Print lines between this version's "## [x.y.z]" header and the next
          # "## [" header. substr matching avoids regex-escaping pitfalls.
          awk -v start="## [$version]" '
            substr($0, 1, length(start)) == start { flag = 1; next }
            flag && substr($0, 1, 4) == "## [" { exit }
            flag { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "See CHANGELOG.md for details." > release-notes.md
          fi

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --notes-file release-notes.md \
            --verify-tag


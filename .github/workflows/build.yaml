name: unified-api CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Released CHANGELOG sections are the record of what shipped; only
      # "## [Unreleased]" is open for editing. Rebasing a branch across a
      # release silently drops its entry into the just-released section, so
      # this is checked rather than remembered. Release branches are exempt:
      # cutting a version is exactly the case that rewrites that region.
      - name: CHANGELOG history is immutable
        if: github.event_name == 'pull_request' && !startsWith(github.head_ref, 'release/')
        env:
          BASE: ${{ github.base_ref }}
        run: |
          git fetch --no-tags --depth=1 origin "$BASE"
          ./scripts/check-changelog.sh "origin/$BASE"

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - run: cargo fmt --check

      - run: cargo clippy --all-targets -- -D warnings

      - run: cargo test

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Scans Cargo.lock against the RUSTSEC advisory database, failing on
      # known-vulnerable dependency versions; ignored advisories (with
      # rationale) live in .cargo/audit.toml. We run cargo-audit directly
      # rather than rustsec/audit-check so the job needs no checks:write token
      # (the default token is read-only) and avoids the deprecated Node 20
      # action runtime.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - run: cargo audit

  build-image:
    needs: test
    # Builds on every PR and every push, publishes only on v* tags.
    # Building everywhere catches image breakage — a builder/runtime base
    # mismatch, a missing apt package — before merge, and long before a tag
    # makes the failure public. Publishing only on tags keeps the registry to
    # released versions instead of one image per merge.
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v7

      - uses: docker/login-action@v4
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v6
        id: meta
        # No raw `latest` tag here: that is what made every merge to main claim
        # the tag. metadata-action's default (latest=auto) already applies
        # `latest` to a semver tag build, which is the only place it belongs.
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=
            type=semver,pattern={{version}}

      - uses: docker/build-push-action@v7
        with:
          context: .
          # Only a v* tag publishes; PRs and main pushes build and throw away
          push: ${{ startsWith(github.ref, 'refs/tags/v') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  release:
    needs: build-image
    # Only on version tags, after the image is published
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Extract changelog section for this version
        run: |
          version="${GITHUB_REF_NAME#v}"
          # Print lines between this version's "## [x.y.z]" header and the next
          # "## [" header. substr matching avoids regex-escaping pitfalls.
          awk -v start="## [$version]" '
            substr($0, 1, length(start)) == start { flag = 1; next }
            flag && substr($0, 1, 4) == "## [" { exit }
            flag { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "See CHANGELOG.md for details." > release-notes.md
          fi

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --notes-file release-notes.md \
            --verify-tag


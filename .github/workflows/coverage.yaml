# Line-coverage gate, separate from "unified-api CI" so the README gets a
# dedicated badge and the (slow, instrumented) build never sits between a
# green test run and a merge — it reports and ratchets, the required checks
# gate.
name: coverage

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: coverage-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - uses: Swatinem/rust-cache@v2

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov

      # The floor is a ratchet against silent erosion, not a target: the suite
      # measures ~94.5% lines at the time of writing, the gate fails under 92 —
      # a real regression trips it, normal variance does not. Raise it when
      # the number durably rises; never lower it to make a PR pass.
      #
      # main.rs is excluded: it is the composition root — wiring plus the boot
      # orchestration — exercisable only by running the binary, and counting
      # its 270-odd lines as permanently red would make the honest number
      # unreadable. Everything main wires IS covered, through AppBuilder.
      - name: Coverage (fail under 92% lines)
        run: |
          cargo llvm-cov --ignore-filename-regex 'main\.rs$' --fail-under-lines 92 --summary-only | tee coverage.txt
          {
            echo '### Coverage'
            echo '```'
            tail -n 3 coverage.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

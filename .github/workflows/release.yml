name: Release

# release-please keeps ONE open pull request, "chore: release vX.Y.Z", up to
# date with every merge into main: it computes the next version from the
# Conventional Commit titles of the squashed pull requests, bumps Cargo.toml
# and Cargo.lock, and writes the CHANGELOG section. Merging that pull request
# is the release: this same workflow then publishes the image and only then
# the tag and the GitHub Release, so nothing is tagged that cannot be pulled.
# See docs/releasing.md.
#
# Everything runs as github-actions[bot] with GITHUB_TOKEN. GitHub starts no
# workflow from what that token pushes, so the release PR would never get its
# required checks, and the tag would never start a publish: the checks are
# dispatched explicitly below, and the publish is a job of this workflow.

on:
  push:
    branches: [main]

permissions:
  contents: read

# Releases queue, never cancel: a merge landing mid-release must not kill the
# publish of the version before it.
concurrency:
  group: release
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  release-please:
    name: Release PR
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write # the autorelease labels on the release PR
      actions: write # dispatching CI on the release branch
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
      version: ${{ steps.rp.outputs.version }}
      sha: ${{ steps.rp.outputs.sha }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: rp
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # The release PR's head was just pushed with GITHUB_TOKEN, which starts
      # no workflow: dispatch CI on it so the required checks report on the
      # PR's head commit and it can be merged.
      - name: Run CI on the release PR
        if: steps.rp.outputs.pr != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Read in the shell: an expression's fromJSON() is evaluated even when
          # the step is skipped, and fails on the empty output of a run with no PR.
          PR: ${{ steps.rp.outputs.pr }}
        run: |
          BRANCH="$(jq -r .headBranchName <<<"$PR")"
          gh workflow run build.yaml --repo "$GITHUB_REPOSITORY" --ref "$BRANCH"
          echo "CI dispatched on $BRANCH"

  # release-please creates the GitHub Release as a draft ("draft": true in
  # release-please-config.json), and a draft has no tag: nothing is visible
  # yet. The image is built from the release commit and pushed, and only then
  # is the draft published, which creates the tag and makes it the latest
  # release. A failed build leaves a draft nobody sees, never a tag without
  # an image; re-running this job finishes the release.
  publish:
    name: Publish image, then the release
    needs: release-please
    # Only when merging the release PR created a release
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write # publishing the draft release, which creates the tag
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.sha }}

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # X.Y.Z, the commit SHA, and latest: only releases publish, so latest
      # always means the newest release, never the tip of main.
      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          flavor: latest=false
          tags: |
            type=raw,value=${{ needs.release-please.outputs.version }}
            type=sha,prefix=
            type=raw,value=latest

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
          echo "Released $TAG"

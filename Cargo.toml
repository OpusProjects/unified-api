[package]
name = "unified-api"
version = "0.11.0"
edition = "2024"
description = "Infrastructure inventory aggregation and caching middleware"
license = "Apache-2.0"
repository = "https://github.com/OpusProjects/unified-api"
readme = "README.md"
# This is a deployed application, not a library — never publish to crates.io
publish = false

[dependencies]
axum = "0.8"
bytes = "1"              # cheaply cloneable byte buffer (shared, not copied)
# Basic auth header for git-over-https credentials. default-features = false
# drops base64's default `simd-unsafe` feature: we encode one short header per
# git operation, so the SIMD engines' unsafe code buys nothing here.
base64 = { version = "0.23", default-features = false, features = ["std"] }
dashmap = "6"
metrics = "0.24.6"
metrics-exporter-prometheus = { version = "0.18.3", default-features = false }
# Remote connector (federation): fetch datasets from other unified-api
# instances. rustls instead of openssl to keep the build self-contained.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
russh = "0.62.1"
serde = { version = "1", features = ["derive", "rc"] }   # rc: Serialize/Deserialize for Arc<T>
serde_json = "1"
serde_yaml_ng = "0.10"   # maintained drop-in fork of the deprecated serde_yaml
subtle = "2"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.7", features = ["cors", "trace", "compression-gzip"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
utoipa = { version = "5", features = ["axum_extras"] }
utoipa-swagger-ui = { version = "9", features = ["axum"] }

# [dev-dependencies] = compiled only for tests, never shipped in the production binary
[dev-dependencies]
# Only the tests fan out over a set of futures now — the SSH connector uses a
# JoinSet, so the production build no longer needs this
futures = "0.3"
# test-util adds virtual time (tokio::time::pause): the scheduler's tick
# behaviour is a property of a 40-second schedule, and this exercises it in
# microseconds instead of making the suite wait
tokio = { version = "1", features = ["test-util"] }
tempfile = "3"
tower = "0.5"            # to call the app as a service (no TCP)
http-body-util = "0.1"   # to read the body of responses

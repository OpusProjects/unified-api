[package]
name = "unified-api"
version = "0.23.0"
edition = "2024"
# MSRV, kept in lockstep with docker/Dockerfile's pinned toolchain: a language
# feature newer than the image's compiler must fail loudly at `cargo build`,
# not at the next image build.
rust-version = "1.96"
description = "Infrastructure inventory aggregation and caching middleware"
license = "Apache-2.0"
repository = "https://github.com/OpusProjects/unified-api"
readme = "README.md"
# This is a deployed application, not a library — never publish to crates.io
publish = false

[dependencies]
axum = "0.8"
bytes = "1"              # cheaply cloneable byte buffer (shared, not copied)
# Basic auth header for git-over-https credentials. default-features = false
# drops base64's default `simd-unsafe` feature: we encode one short header per
# git operation, so the SIMD engines' unsafe code buys nothing here.
base64 = { version = "0.23", default-features = false, features = ["std"] }
dashmap = "6"
# Hashed known_hosts entries (|1|salt|hash) are HMAC-SHA1 of the hostname.
# Both crates are already in the tree as russh dependencies — pinning the
# same versions adds no new code to the build.
hmac = "0.13"
sha1 = "0.11"
# Content hashes for the configuration API: a file's ETag is the sha256 of
# its bytes, so a write can be refused when someone else changed it first.
# Same digest generation as sha1 above, and already in the tree transitively.
sha2 = "0.11"
metrics = "0.24.6"
metrics-exporter-prometheus = { version = "0.18.3", default-features = false }
# Remote connector (federation): fetch datasets from other unified-api
# instances. rustls instead of openssl to keep the build self-contained.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
russh = "0.63.1"
serde = { version = "1", features = ["derive", "rc"] }   # rc: Serialize/Deserialize for Arc<T>
serde_json = "1"
serde_yaml_ng = "0.10"   # maintained drop-in fork of the deprecated serde_yaml
subtle = "2"
tokio = { version = "1", features = ["full"] }
# The CORS middleware wraps tower-http's CorsLayer around the rest of the
# stack per request (Layer + oneshot from `util`), which is what makes the
# origin list reloadable. Already in the tree as an axum dependency — this
# adds no new code to the build.
tower = { version = "0.5", default-features = false, features = ["util"] }
tower-http = { version = "0.7", features = ["cors", "trace", "compression-gzip", "request-id"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
utoipa = { version = "5", features = ["axum_extras"] }
utoipa-swagger-ui = { version = "9", features = ["axum"] }
croner = "3.0.1"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }

# The hot-path benches (cache read/serialize, view union): the README's value
# proposition is performance-shaped, so the claims have numbers behind them.
# `cargo bench` runs them; clippy compiles them on every CI run.
[[bench]]
name = "hot_paths"
harness = false

# [dev-dependencies] = compiled only for tests, never shipped in the production binary
[dev-dependencies]
# Only the tests fan out over a set of futures now — the SSH connector uses a
# JoinSet, so the production build no longer needs this
futures = "0.3"
# Statistical benchmarking for benches/hot_paths.rs
criterion = "0.8"
# test-util adds virtual time (tokio::time::pause): the scheduler's tick
# behaviour is a property of a 40-second schedule, and this exercises it in
# microseconds instead of making the suite wait
tokio = { version = "1", features = ["test-util"] }
# The SSH connector's integration tests run an in-process russh SERVER, so
# the suite needs no sshd and no network. Same version as the main
# dependency — Cargo unifies them.
russh = "0.63.1"
tempfile = "3"
tower = "0.5"            # to call the app as a service (no TCP)
http-body-util = "0.1"   # to read the body of responses

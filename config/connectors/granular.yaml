---
# A script that can gather ONE host without gathering the inventory. The full
# sync calls it with script_args, a `?host=` sync with host_args instead:
#
#   POST /api/v1/sources/src-granular/sync                      -> --list
#   POST /api/v1/sources/src-granular/sync?host=motoko.section9.net
#                                        -> --only-host motoko.section9.net
#
# Try it and read `called_with` on the host to see which mode ran.
connectors:
  - name: granular
    description: "Granular inventory script"
    project: "prj-connectors-infra"
    path: "tests/adapters/out/connectors/granular.py"
    script_args: ["--list"]
    host_args: ["--only-host", "{target}"]

---
# SSH: the native connector, nothing installed on the hosts. `location: host`
# means `path` is on each host: every file it matches is run if executable,
# read if not, and becomes a fact named after it (Ansible's local facts).
# The other choices: a script file here (`project` + `path`, or
# `location: instance`) or one written in the item (`script:`), streamed to
# each host and run there.
connectors:
  - name: ssh-facts
    description: "SSH fact gathering"
    type: "ssh"
    location: "host"
    path: "/etc/ansible/facts.d/*.fact"

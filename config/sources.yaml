src-section9:
  name: "Section 9 Inventory"
  project_id: "prj-connectors-infra"
  script_path: "tests/adapters/out/connectors/inventory.py"
  credential_ids: ["cred-section9-api"]
  # schedule: "0 */1 * * *"    # cron (UTC) instead of the interval — pick one
  sync_interval_seconds: 60
  ttl_seconds: 3600
  ttl_overrides:
    groups:
      production: 900
    hosts:
      motoko.section9.net: 300

src-infra:
  name: "Infrastructure Data"
  project_id: "prj-connectors-infra"
  script_path: "tests/adapters/out/connectors/infra.py"
  credential_ids: []
  sync_interval_seconds: 300
  ttl_seconds: 3600
  sync_mode: "replace"

src-section9-large:
  name: "Section 9 Large Inventory"
  project_id: "prj-connectors-infra"
  script_path: "tests/adapters/out/connectors/inventory.py"
  credential_ids: []
  # Cron cadence (UTC): every 2 hours on the hour, instead of an interval
  schedule: "0 */2 * * *"
  ttl_seconds: 7200
  config:
    scenario: "large"

src-ssh-example:
  name: "SSH Facts Gathering"
  connector_type: "ssh"
  project_id: "prj-connectors-infra"
  script_path: "gather_facts"
  credential_ids: ["cred-ssh-infra"]
  sync_interval_seconds: 300
  ttl_seconds: 600
  config:
    hosts: "host1.example.com,host2.example.com"
    port: "22"
    concurrency: "50"
    ssh_connect_timeout_seconds: "30"
    gather_mode: "facts"
    fact_path: "/etc/ansible/facts.d"
    # Host key verification: point at ssh-keyscan output to refuse unknown or
    # changed server keys BEFORE authenticating (docs/connectors.md). Left
    # commented because startup validation requires the file to exist;
    # without it any key is accepted and every sync logs a warning.
    # ssh_known_hosts: "/etc/unified-api/known_hosts"

# A script that can gather ONE host without gathering the inventory. The full
# sync calls it with script_args, a `?host=` sync with host_args instead:
#
#   POST /api/v1/sources/src-granular/sync                      -> --list
#   POST /api/v1/sources/src-granular/sync?host=motoko.section9.net
#                                        -> --only-host motoko.section9.net
#
# Try it and read `called_with` on the host to see which mode ran.
src-granular:
  name: "Granular Inventory"
  project_id: "prj-connectors-infra"
  script_path: "tests/adapters/out/connectors/granular.py"
  script_args: ["--list"]
  host_args: ["--only-host", "{target}"]
  # The granular mode describes the groups it puts the host in, so take their
  # vars as well (off by default)
  host_sync_updates_group_vars: true
  credential_ids: []
  sync_interval_seconds: 300
  ttl_seconds: 3600

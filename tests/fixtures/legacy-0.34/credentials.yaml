---
cred-git:
  name: "Git token"
  type: "token"
  env_prefix: "GIT"
  secret_keys:
    token: "TOKEN"
cred-d42-pq:
  name: "Device42 PQ"
  type: "username_password"
  env_prefix: "D42"
  secret_keys:
    username: "USERNAME"
    password: "PASSWORD"
    base_url: "BASE_URL"
cred-d42-cdi:
  name: "Device42 CDI"
  type: "username_password"
  env_prefix: "D42_CDI"
  secret_keys:
    username: "USERNAME"
    password: "PASSWORD"
    base_url: "BASE_URL"
cred-pq-ssh:
  name: "PQ SSH key"
  type: "ssh_key"
  env_prefix: "PQ_SSH"
  secret_keys:
    username: "USERNAME"
  file_keys:
    ssh_key: "/run/secrets/ssh-connector/private_key"
cred-cdi-ssh:
  name: "CDI SSH key"
  type: "ssh_key"
  env_prefix: "CDI_SSH"
  secret_keys:
    username: "USERNAME"
  file_keys:
    ssh_key: "/run/secrets/ssh-connector-cdi/private_key"
cred-vcenter:
  name: "vCenter"
  type: "username_password"
  env_prefix: "VCENTER"
  secret_keys:
    vcenter_username: "USERNAME"
    vcenter_password: "PASSWORD"
cred-edge-dc4:
  name: "DC4 edge API key"
  type: "token"
  env_prefix: "EDGE_DC4"
  secret_keys:
    token: "TOKEN"
cred-edge-dc1:
  name: "DC1 edge API key"
  type: "token"
  env_prefix: "EDGE_DC1"
  secret_keys:
    token: "TOKEN"
cred-ldap:
  name: "Directory bind account"
  type: "username_password"
  env_prefix: "LDAP"
  secret_keys:
    username: "USERNAME"
    password: "PASSWORD"

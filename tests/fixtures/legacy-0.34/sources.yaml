---
# Three tenants of the same CMDB: one script, three configs.
src-d42-pq:
  name: "Device42 PQ Inventory"
  connector_type: "script"
  project_id: "prj-ansible-inventory"
  script_path: "dynamic/d42/inventory.py"
  script_args: ["--list"]
  host_args: ["--host-with-groups", "{target}"]
  output_format: "ansible"
  credential_ids: ["cred-d42-pq"]
  sync_interval_seconds: 7200
  ttl_seconds: 600
  config:
    D42_CONFIG_DIR: "yaml/pq"
    D42_CRED_PREFIX: "CREDENTIAL"

src-d42-iii:
  name: "Device42 III Inventory"
  connector_type: "script"
  project_id: "prj-ansible-inventory"
  script_path: "dynamic/d42/inventory.py"
  script_args: ["--list"]
  host_args: ["--host-with-groups", "{target}"]
  output_format: "ansible"
  credential_ids: ["cred-d42-pq"]
  sync_interval_seconds: 7200
  ttl_seconds: 600
  config:
    D42_CONFIG_DIR: "yaml/iii"
    D42_CRED_PREFIX: "CREDENTIAL"

src-d42-cdi:
  name: "Device42 CDI Inventory"
  connector_type: "script"
  project_id: "prj-ansible-inventory"
  script_path: "dynamic/d42/inventory.py"
  script_args: ["--list"]
  host_args: ["--host-with-groups", "{target}"]
  output_format: "ansible"
  credential_ids: ["cred-d42-cdi"]
  sync_interval_seconds: 7200
  ttl_seconds: 600
  config:
    D42_CONFIG_DIR: "yaml/cdi"
    D42_CRED_PREFIX: "CREDENTIAL"

src-ssh-pq-facts:
  name: "PQ SSH facts"
  connector_type: "ssh"
  project_id: "prj-connectors-infra"
  script_path: "gather_facts"
  credential_ids: ["cred-pq-ssh"]
  sync_interval_seconds: 7200
  ttl_seconds: 14400
  timeout_seconds: 600
  hosts_from_source:
    source: "src-d42-pq"
    connect_via: "ansible_host_then_hostname"
  config:
    concurrency: "20"
    gather_mode: "facts"
    fact_path: "/etc/ansible/facts.d"

src-edge-pq-aa1:
  name: "PQ AA1 facts"
  connector_type: "ssh"
  project_id: "prj-connectors-infra"
  script_path: "gather_facts"
  credential_ids: ["cred-pq-ssh"]
  schedule: "30 3 * * *"
  ttl_seconds: 30
  allow_on_demand_refresh: true
  timeout_seconds: 600
  hosts_from_source:
    source: "src-d42-pq"
    match_pattern:
      groups: ["datacenter_aa1"]
    connect_via: "ansible_host_then_hostname"
  config:
    concurrency: "20"
    gather_mode: "facts"

# A whole remote script in script_path: gather_mode "script" runs it on each
# host and reads its stdout as that host's vars.
src-ssh-cdi-osinfo:
  name: "CDI OS inventory (over SSH)"
  connector_type: "ssh"
  project_id: "prj-connectors-infra"
  script_path: |-
    ID=; VERSION_ID=
    [ -r /etc/os-release ] && . /etc/os-release
    printf '{"osinfo":{"id":"%s","version_id":"%s"}}\n' "$ID" "$VERSION_ID"
  credential_ids: ["cred-cdi-ssh"]
  schedule: "20 4 * * *"
  ttl_seconds: 90000
  timeout_seconds: 600
  hosts_from_source:
    source: "src-d42-cdi"
    connect_via: "ansible_host_then_hostname"
  config:
    concurrency: "50"
    gather_mode: "script"

# The same script twice with different arguments: two connectors.
src-vmware:
  name: "VMware vCenter Inventory"
  connector_type: "script"
  project_id: "prj-ansible-inventory"
  script_path: "dynamic/vmware/inventory.py"
  script_args: ["--list", "--no-resolve-fqdn"]
  output_format: "ansible"
  credential_ids: ["cred-vcenter"]
  sync_interval_seconds: 7200
  ttl_seconds: 600

src-vmware-fqdn:
  name: "VMware vCenter Inventory, DNS-resolved names"
  connector_type: "script"
  project_id: "prj-ansible-inventory"
  script_path: "dynamic/vmware/inventory.py"
  script_args: ["--list", "--resolve-fqdn"]
  output_format: "ansible"
  credential_ids: ["cred-vcenter"]
  sync_interval_seconds: 21600
  ttl_seconds: 21600
  timeout_seconds: 1800

src-taxonomy:
  name: "Business taxonomy"
  connector_type: "script"
  project_id: "prj-ansible-inventory"
  script_path: "dynamic/taxonomy/inventory_taxonomy_cat.sh"
  script_args: ["--list"]
  output_format: "ansible"
  sync_interval_seconds: 86400
  ttl_seconds: 86400

src-edge-pq-dc4:
  name: "PQ DC4 edge"
  connector_type: "remote"
  project_id: "prj-ansible-inventory"
  script_path: "src-ssh-facts"
  credential_ids: ["cred-edge-dc4"]
  schedule: "0 4 * * *"
  ttl_seconds: 30
  allow_on_demand_refresh: true
  config:
    url: "https://edge-dc4.example.invalid:8443"
    http_timeout_seconds: "120"

src-edge-cdi-dc01:
  name: "CDI DC01 edge"
  connector_type: "remote"
  project_id: "prj-ansible-inventory"
  script_path: "src-ssh-facts"
  credential_ids: ["cred-edge-dc1"]
  schedule: "30 4 * * *"
  ttl_seconds: 30
  allow_on_demand_refresh: true
  config:
    url: "https://edge-dc01.example.invalid:8443"
    http_timeout_seconds: "120"

src-pcd-inventory-pq_vars:
  name: "Declared inventory variables (PQ)"
  connector_type: "static_inventory"
  project_id: "prj-ansible-inventory"
  script_path: "static/pq/inventory.yaml"
  sync_interval_seconds: 3600
  ttl_seconds: 7200
